<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Veggie Clash (Beta)</title><meta name="description" content="Veggie Clash beta: collect seeds, bump rival veggies, win the kitchen.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one full-screen portrait stage (9:16 on wide screens), loading card over it until the game runs. */
  :root {
    --night: #2f3240;
    --stage: #3b3f4e;
    --slime: #d9a15a;
    --slime-deep: #a8743a;
    --ink: #fffcf6;
    --muted: #b9b3a6;
    --alarm: #ff5a4e;
    --display: "Nunito", "Segoe UI", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #stage {
    position: relative;
    height: 100%;
    width: 100%;
    max-width: 100%;   /* beta: the game adapts to any aspect (phones, tablets, desktop) */
    margin: 0 auto;
    background: var(--stage);
  }
  #unity-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
    background: var(--stage);
  }
  #loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background:
      radial-gradient(circle at 50% 38%, rgba(217, 161, 90, 0.16), transparent 55%),
      var(--night);
    text-align: center;
    transition: opacity 0.4s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .blob {
    width: 112px; height: 96px;
    background: var(--slime);
    border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
    position: relative;
    box-shadow: inset 0 -12px 0 var(--slime-deep);
    animation: wobble 1.1s ease-in-out infinite;
  }
  .blob::before, .blob::after {
    content: ""; position: absolute; top: 26px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff;
    box-shadow: inset 6px 4px 0 2px #1b1b1b;
  }
  .blob::before { left: 24px; }
  .blob::after { right: 24px; }
  @keyframes wobble {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.08, 0.92) translateY(4px); }
  }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 12vw, 64px);
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--slime);
    text-shadow: none;
    text-wrap: balance;
  }
  .tag { margin: -10px 0 0; color: var(--muted); font-weight: 600; font-size: 16px; }
  .bar {
    width: min(280px, 80%);
    height: 14px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: var(--slime);
    border-radius: 7px;
  }
  #status { margin: 0; font-weight: 800; font-size: 14px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  #status.err { color: var(--alarm); text-transform: none; letter-spacing: 0; max-width: 32ch; }
  .hint { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; margin: 0; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
  .cast { display: flex; align-items: flex-end; gap: 14px; }
  .cast .v { display: block; }
  .cast .pep { width: 46px; height: 70px; border-radius: 48% 48% 40% 40% / 60% 60% 40% 40%; background: #e4572e; box-shadow: inset 0 -8px 0 #b8432a; animation: wobble 1.1s ease-in-out infinite 0.2s; }
  .cast .tom { width: 60px; height: 54px; border-radius: 50%; background: #e4572e; box-shadow: inset 0 -8px 0 #b8432a; animation: wobble 1.1s ease-in-out infinite 0.4s; }
  .beta { font-family: var(--body); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; vertical-align: super; background: var(--slime); color: var(--night); padding: 2px 7px; border-radius: 6px; }
</style>

<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="cast" aria-hidden="true"><span class="v pep"></span><span class="v blob"></span><span class="v tom"></span></div>
    <h1>VEGGIE CLASH <sup class="beta">BETA</sup></h1>
    <p class="tag">Collect seeds. Bump rivals. Win the kitchen.</p>
    <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
    <p id="status">Loading 0%</p>
    <p class="hint">Drag to move &middot; double-tap to dash &middot; best in portrait</p>
  </div>
</div>

<script src="Build/loader.js"></script>
<script>
  (function () {
    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var fill = document.getElementById("fill");
    var status = document.getElementById("status");
    var bar = loader.querySelector(".bar");

    function fail(msg) {
      status.textContent = msg;
      status.className = "err";
    }

    // Stop the page from scrolling or zooming while playing.
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    // Double-tap is the dash: never let the browser zoom or select on it (iOS Safari).
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
    var lastEnd = 0;
    document.addEventListener("touchend", function (e) { var now = Date.now(); if (now - lastEnd < 350) e.preventDefault(); lastEnd = now; }, { passive: false });
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    if (typeof createUnityInstance !== "function") {
      fail("The game files did not load. Reload the page to try again.");
      return;
    }

    createUnityInstance(canvas, {
      // Gzip files, decompressed by the loader itself (it detects the compression from the bytes).
      dataUrl: "Build/data.gz.wasm",
      frameworkUrl: "Build/framework.gz.wasm",
      codeUrl: "Build/code.gz.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ahmad",
      productName: "Veggie Clash",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      showBanner: function (msg, type) {
        if (type === "error") fail(msg);
        else console.warn(msg);
      }
    }, function (p) {
      var pct = p >= 0.9 ? 100 : Math.round(p / 0.9 * 100);
      fill.style.width = pct + "%";
      bar.setAttribute("aria-valuenow", pct);
      status.textContent = pct < 100 ? "Loading " + pct + "%" : "Starting";
    }).then(function () {
      loader.classList.add("done");
      setTimeout(function () { loader.hidden = true; }, 450);
      canvas.focus();
    }).catch(function (err) {
      fail("The game could not start on this browser: " + (err && err.message ? err.message : err));
    });
  })();
</script>
